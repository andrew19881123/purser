name: CI

on:
  push:
    branches: [main]
  pull_request:

# Note: CI uses the standard GitHub setup actions rather than the project-local
# `make setup` bootstrap (which downloads full toolchains into .toolchain/).
jobs:
  proto:
    name: proto (buf lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99  # v1.50.0
      - run: buf lint
        working-directory: proto

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: rust
      - name: build
        working-directory: rust
        run: cargo build --workspace --locked
      - name: test
        working-directory: rust
        run: cargo test --workspace --locked
      - name: clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: fmt
        working-directory: rust
        run: cargo fmt --all -- --check

  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        module: [planner, controlplane]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/${{ matrix.module }}/go.mod
          cache-dependency-path: go/${{ matrix.module }}/go.sum
      - name: build
        working-directory: go/${{ matrix.module }}
        run: go build ./...
      - name: vet
        working-directory: go/${{ matrix.module }}
        run: go vet ./...
      - name: test
        working-directory: go/${{ matrix.module }}
        run: go test ./...
      - name: benchmark
        if: matrix.module == 'planner'
        working-directory: go/planner
        run: |
          CGO_ENABLED=0 go test ./plan/... -bench=. -benchmem -benchtime=1x \
            -run='^$' 2>&1 | tee /tmp/planner-bench-results.txt
          cat /tmp/planner-bench-results.txt
      - name: gofmt
        run: |
          files=$(gofmt -l go enterprise/license)
          [ -z "$files" ] || { echo "gofmt needs to be run on:"; echo "$files"; exit 1; }

  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: install
        working-directory: ui
        run: npm ci
      - name: typecheck
        working-directory: ui
        run: npm run typecheck
      - name: build
        working-directory: ui
        run: npm run build
      - name: test
        working-directory: ui
        run: npm test

  security-scan:
    name: Container security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs in parallel with other jobs — does not block them
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build gateway image for scan
        # gateway.Dockerfile final runtime stage is named "final" (debian:bookworm-slim)
        run: |
          docker build -f deploy/docker/gateway.Dockerfile \
            --target final \
            -t purser-gateway:scan .

      - name: Build control-plane image for scan
        # control-plane.Dockerfile final stage is unnamed (distroless/static); build full image
        run: |
          docker build -f deploy/docker/control-plane.Dockerfile \
            -t purser-control-plane:scan .

      - name: Trivy scan — gateway
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: purser-gateway:scan
          format: sarif
          output: trivy-gateway.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true  # ignore CVEs with no available fix

      - name: Trivy scan — control-plane
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: purser-control-plane:scan
          format: sarif
          output: trivy-cp.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true  # ignore CVEs with no available fix

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        if: always()  # upload even if the scan found issues
        with:
          sarif_file: '*.sarif'
