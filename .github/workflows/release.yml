name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.2.0)'
        required: true

# contents:write  — create GitHub Releases and upload assets
# packages:write  — push images to GHCR and Helm chart to GHCR OCI
# id-token:write  — OIDC token (future provenance / Sigstore)
permissions:
  contents: write
  packages: write
  id-token: write

# TAG is the full version string (e.g. v0.2.0).
# For a tag push it comes directly from the git ref; for a manual dispatch
# the caller supplies it via the `tag` input.
env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # ── Job 1: Go ──────────────────────────────────────────────────────────────
  build-go:
    name: Build Go binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/controlplane/go.mod
          cache-dependency-path: go/controlplane/go.sum

      # Build the control-plane as a fully-static linux/amd64 binary.
      # GOWORK=off: match the Dockerfile pattern — rely on in-module `replace`
      # directives; do not use the go.work workspace in this context.
      - name: Build control-plane
        working-directory: go/controlplane
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOWORK: "off"
        run: |
          mkdir -p ../../bin
          go build -trimpath -ldflags "-s -w" -o ../../bin/control-plane .

      - name: Build control-plane (linux/arm64)
        working-directory: go/controlplane
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
          GOWORK: "off"
        run: |
          mkdir -p ../../bin-arm64
          go build -trimpath -ldflags "-s -w" -o ../../bin-arm64/control-plane .

      - name: Build control-plane (darwin/arm64)
        working-directory: go/controlplane
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
          GOWORK: "off"
        run: |
          mkdir -p ../../bin-darwin-arm64
          go build -trimpath -ldflags "-s -w" -o ../../bin-darwin-arm64/control-plane .

      # go/planner is a library — no runnable binary to produce.

      - uses: actions/upload-artifact@v4
        with:
          name: go-binaries-amd64
          path: bin/

      - uses: actions/upload-artifact@v4
        with:
          name: go-binaries-arm64
          path: bin-arm64/

      - uses: actions/upload-artifact@v4
        with:
          name: go-binaries-darwin-arm64
          path: bin-darwin-arm64/

  # ── Job 2: Rust ────────────────────────────────────────────────────────────
  build-rust:
    name: Build Rust binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install the toolchain declared in rust/rust-toolchain.toml (stable,
      # minimal profile). Using @master so it reads the file when located at
      # the workspace root; we supply the channel explicitly here because the
      # toolchain file lives under rust/ rather than the repo root.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # CARGO_INCREMENTAL=0 — incremental artifacts have no value for a
      # release build and only bloat the target directory.
      - name: Build purser-agent and purser-gateway (linux/amd64)
        working-directory: rust
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: target
        run: cargo build --release -p purser-agent -p purser-gateway

      - name: Build purser-agent (linux/arm64)
        working-directory: rust
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: target
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get install -y gcc-aarch64-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
          cargo build --release -p purser-agent \
            --target aarch64-unknown-linux-gnu

      # darwin/arm64: cross-compiling Rust on Linux for macOS requires osxcross.
      # Flagged best-effort — the release succeeds even if this step fails.
      - name: Build purser-agent (darwin/arm64)
        id: build-rust-darwin-arm64
        continue-on-error: true
        working-directory: rust
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: target
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --release -p purser-agent \
            --target aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: rust-binaries-amd64
          path: |
            rust/target/release/purser-agent
            rust/target/release/purser-gateway

      - uses: actions/upload-artifact@v4
        with:
          name: rust-binaries-arm64
          path: rust/target/aarch64-unknown-linux-gnu/release/purser-agent

      - uses: actions/upload-artifact@v4
        if: steps.build-rust-darwin-arm64.outcome == 'success'
        with:
          name: rust-binaries-darwin-arm64
          path: rust/target/aarch64-apple-darwin/release/purser-agent

  # ── Job 3: Package (.deb, .rpm, tarballs) ──────────────────────────────────
  package:
    name: Package (deb, rpm, tarballs)
    runs-on: ubuntu-latest
    needs: [build-go, build-rust]
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: go-binaries-amd64
          path: bin/

      # Place Rust binaries at the path the nfpm config expects:
      #   packaging/nfpm/purser-agent.yaml     → src: rust/target/release/purser-agent
      #   packaging/nfpm/purser-agent-arm64.yaml → src: rust/target/aarch64-unknown-linux-gnu/release/purser-agent
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries-amd64
          path: rust/target/release/

      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries-arm64
          path: rust/target/aarch64-unknown-linux-gnu/release/

      - uses: actions/download-artifact@v4
        with:
          name: go-binaries-arm64
          path: bin-arm64/

      - uses: actions/download-artifact@v4
        with:
          name: go-binaries-darwin-arm64
          path: bin-darwin-arm64/

      # darwin Rust binary is best-effort; download may fail if cross-compile failed.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: rust-binaries-darwin-arm64
          path: rust/target/aarch64-apple-darwin/release/

      - name: Fix binary permissions
        run: |
          chmod +x bin/control-plane
          chmod +x rust/target/release/purser-agent
          chmod +x rust/target/release/purser-gateway
          chmod +x rust/target/aarch64-unknown-linux-gnu/release/purser-agent
          chmod +x bin-arm64/control-plane
          chmod +x bin-darwin-arm64/control-plane
          # darwin Rust binary is best-effort; ignore if absent
          chmod +x rust/target/aarch64-apple-darwin/release/purser-agent 2>/dev/null || true

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      # Build .deb and .rpm packages.
      # VERSION (no leading 'v') is set in the environment for nfpm config
      # expansion — the config at packaging/nfpm/purser-agent.yaml can
      # reference ${VERSION} once updated to use dynamic versioning.
      - name: Build .deb and .rpm packages
        env:
          VERSION: ${{ env.TAG != '' && env.TAG || inputs.tag }}
        run: |
          # Strip leading 'v' from version tag (e.g. v0.2.0 -> 0.2.0)
          export VERSION=${VERSION#v}
          mkdir -p dist
          nfpm pkg --config packaging/nfpm/purser-agent.yaml --packager deb --target dist/
          nfpm pkg --config packaging/nfpm/purser-agent.yaml --packager rpm --target dist/

      - name: Build .deb and .rpm packages (arm64)
        env:
          VERSION: ${{ env.TAG != '' && env.TAG || inputs.tag }}
        run: |
          export VERSION=${VERSION#v}
          nfpm pkg --config packaging/nfpm/purser-agent-arm64.yaml --packager deb --target dist/
          nfpm pkg --config packaging/nfpm/purser-agent-arm64.yaml --packager rpm --target dist/

      # One tarball per binary, named with the full version tag.
      - name: Create binary tarballs
        run: |
          TAG=${{ env.TAG }}
          mkdir -p dist
          tar -czf dist/purser-agent-linux-amd64-${TAG}.tar.gz \
            -C rust/target/release purser-agent
          tar -czf dist/purser-gateway-linux-amd64-${TAG}.tar.gz \
            -C rust/target/release purser-gateway
          tar -czf dist/control-plane-linux-amd64-${TAG}.tar.gz \
            -C bin control-plane

      - name: Create ARM64 and darwin binary tarballs
        run: |
          TAG=${{ env.TAG }}
          # linux/arm64
          tar -czf dist/purser-agent-linux-arm64-${TAG}.tar.gz \
            -C rust/target/aarch64-unknown-linux-gnu/release purser-agent
          tar -czf dist/control-plane-linux-arm64-${TAG}.tar.gz \
            -C bin-arm64 control-plane
          # darwin/arm64 (best-effort: only package if binaries exist)
          if [ -f rust/target/aarch64-apple-darwin/release/purser-agent ]; then
            tar -czf dist/purser-agent-darwin-arm64-${TAG}.tar.gz \
              -C rust/target/aarch64-apple-darwin/release purser-agent
          fi
          if [ -f bin-darwin-arm64/control-plane ]; then
            tar -czf dist/control-plane-darwin-arm64-${TAG}.tar.gz \
              -C bin-darwin-arm64 control-plane
          fi

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS

      - name: Compute artifact hashes
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum * | base64 -w0)" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/

  # ── Job 4: SLSA L2 Provenance ──────────────────────────────────────────────
  provenance:
    name: SLSA L2 Provenance
    needs: [package]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.package.outputs.hashes }}"

  # ── Job 5: Docker (GHCR) ───────────────────────────────────────────────────
  docker:
    name: Docker images (GHCR)
    runs-on: ubuntu-latest
    needs: [build-go, build-rust]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Install cosign once; used for keyless signing of all three images below.
      # Signing uses the GitHub Actions OIDC token via id-token:write — no
      # secrets or long-lived keys required.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Each Dockerfile performs its own multi-stage build from source; the
      # pre-built binaries from jobs 1 and 2 act as a quality gate only.

      - name: Build and push control-plane image
        id: push-control-plane
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/control-plane.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/purser-control-plane:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/purser-control-plane:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # Sign by digest (not tag) to pin the exact image layer set.
      # The signature is pushed to the same GHCR namespace alongside the image.
      - name: Sign container image — control-plane
        env:
          DIGEST: ${{ steps.push-control-plane.outputs.digest }}
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/purser-control-plane@${DIGEST}

      - name: Build and push gateway image
        id: push-gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/gateway.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/purser-gateway:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/purser-gateway:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Sign container image — gateway
        env:
          DIGEST: ${{ steps.push-gateway.outputs.digest }}
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/purser-gateway@${DIGEST}

      - name: Build and push ui image
        id: push-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/ui.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/purser-ui:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/purser-ui:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Sign container image — ui
        env:
          DIGEST: ${{ steps.push-ui.outputs.digest }}
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/purser-ui@${DIGEST}

      - name: Record image digests
        run: |
          mkdir -p dist/digests
          echo '${{ steps.push-control-plane.outputs.digest }}' > dist/digests/control-plane
          echo '${{ steps.push-gateway.outputs.digest }}'       > dist/digests/gateway
          echo '${{ steps.push-ui.outputs.digest }}'            > dist/digests/ui

      - uses: actions/upload-artifact@v4
        with:
          name: docker-digests
          path: dist/digests/

  # ── Job 6: GitHub Release + Helm OCI ───────────────────────────────────────
  release:
    name: GitHub Release + Helm OCI push
    runs-on: ubuntu-latest
    needs: [package, docker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: docker-digests
          path: dist/digests/

      # Install cosign for keyless blob signing of the binary tarballs.
      # Uses the GitHub Actions OIDC token — no secrets or long-lived keys.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Login to GHCR so cosign can push attestation signatures and the Helm
      # chart signature to the registry without a separate keyring step.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate SPDX SBOMs — runs here (after docker job) so images exist.
      - name: Generate SBOM — control-plane
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/purser-control-plane:${{ env.TAG }}
          artifact-name: sbom-control-plane.spdx.json
          output-file: dist/sbom-control-plane.spdx.json

      - name: Generate SBOM — gateway
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/purser-gateway:${{ env.TAG }}
          artifact-name: sbom-gateway.spdx.json
          output-file: dist/sbom-gateway.spdx.json

      - name: Generate SBOM — ui
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/purser-ui:${{ env.TAG }}
          artifact-name: sbom-ui.spdx.json
          output-file: dist/sbom-ui.spdx.json

      # Attach each SBOM as a cosign in-toto attestation on the image digest.
      # Uses OIDC keyless signing — no key management required.
      # Digests are read from the files produced by the docker job.
      - name: Attach SBOM attestations to images
        run: |
          cosign attest --yes --predicate dist/sbom-control-plane.spdx.json \
            --type spdxjson \
            ghcr.io/${{ github.repository_owner }}/purser-control-plane@$(cat dist/digests/control-plane)
          cosign attest --yes --predicate dist/sbom-gateway.spdx.json \
            --type spdxjson \
            ghcr.io/${{ github.repository_owner }}/purser-gateway@$(cat dist/digests/gateway)
          cosign attest --yes --predicate dist/sbom-ui.spdx.json \
            --type spdxjson \
            ghcr.io/${{ github.repository_owner }}/purser-ui@$(cat dist/digests/ui)

      # Sign each binary tarball; the cosign bundle (*.bundle) embeds the
      # certificate and signature and is uploaded as a release asset alongside
      # the tarball so users can verify offline with cosign verify-blob.
      - name: Sign tarballs with cosign
        run: |
          TAG=${{ env.TAG }}
          # linux/amd64
          cosign sign-blob --yes \
            --bundle dist/purser-agent-linux-amd64-${TAG}.tar.gz.bundle \
            dist/purser-agent-linux-amd64-${TAG}.tar.gz
          cosign sign-blob --yes \
            --bundle dist/purser-gateway-linux-amd64-${TAG}.tar.gz.bundle \
            dist/purser-gateway-linux-amd64-${TAG}.tar.gz
          cosign sign-blob --yes \
            --bundle dist/control-plane-linux-amd64-${TAG}.tar.gz.bundle \
            dist/control-plane-linux-amd64-${TAG}.tar.gz
          # linux/arm64
          cosign sign-blob --yes \
            --bundle dist/purser-agent-linux-arm64-${TAG}.tar.gz.bundle \
            dist/purser-agent-linux-arm64-${TAG}.tar.gz
          cosign sign-blob --yes \
            --bundle dist/control-plane-linux-arm64-${TAG}.tar.gz.bundle \
            dist/control-plane-linux-arm64-${TAG}.tar.gz
          # darwin/arm64 (best-effort — only sign if the tarballs exist)
          for f in \
            dist/purser-agent-darwin-arm64-${TAG}.tar.gz \
            dist/control-plane-darwin-arm64-${TAG}.tar.gz; do
            if [ -f "$f" ]; then
              cosign sign-blob --yes --bundle "${f}.bundle" "$f"
            fi
          done

      # Push packages to the Cloudsmith hosted apt/yum repository.
      # || true on every push so the release does not fail when
      # CLOUDSMITH_API_KEY has not been added yet — add the secret at:
      # https://github.com/andrew19881123/purser/settings/secrets/actions
      - name: Push to Cloudsmith apt/yum repository
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          pip install cloudsmith-cli
          # Push .deb to apt repo
          for deb in dist/*.deb; do
            cloudsmith push deb andrew19881123/purser/any-distro/any-version "$deb" || true
          done
          # Push .rpm to yum repo
          for rpm in dist/*.rpm; do
            cloudsmith push rpm andrew19881123/purser/any-distro/any-version "$rpm" || true
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.tar.gz.bundle
            dist/*.spdx.json
            dist/SHA256SUMS
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ env.TAG }}/CHANGELOG.md) for full release notes.

      # Package and push the Helm chart to the GHCR OCI registry.
      # Chart version is the numeric part of the tag (no leading 'v').
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push Helm chart to GHCR OCI
        run: |
          TAG=${{ env.TAG }}
          VERSION=${TAG#v}
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/purser --version "${VERSION}" --destination dist/
          helm push dist/purser-${VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      # Sign the Helm chart OCI artefact with cosign keyless signing so
      # operators can verify it with `cosign verify` before installing.
      - name: Sign Helm chart
        run: |
          TAG=${{ env.TAG }}
          VERSION=${TAG#v}
          cosign sign --yes oci://ghcr.io/${{ github.repository_owner }}/charts/purser:${VERSION}
