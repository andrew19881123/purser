name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.2.0)'
        required: true

# contents:write  — create GitHub Releases and upload assets
# packages:write  — push images to GHCR and Helm chart to GHCR OCI
# id-token:write  — OIDC token (future provenance / Sigstore)
permissions:
  contents: write
  packages: write
  id-token: write

# TAG is the full version string (e.g. v0.2.0).
# For a tag push it comes directly from the git ref; for a manual dispatch
# the caller supplies it via the `tag` input.
env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # ── Job 1: Go ──────────────────────────────────────────────────────────────
  build-go:
    name: Build Go binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/controlplane/go.mod
          cache-dependency-path: go/controlplane/go.sum

      # Build the control-plane as a fully-static linux/amd64 binary.
      # GOWORK=off: match the Dockerfile pattern — rely on in-module `replace`
      # directives; do not use the go.work workspace in this context.
      - name: Build control-plane
        working-directory: go/controlplane
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOWORK: "off"
        run: |
          mkdir -p ../../bin
          go build -trimpath -ldflags "-s -w" -o ../../bin/control-plane .

      # go/planner is a library — no runnable binary to produce.

      - uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: bin/

  # ── Job 2: Rust ────────────────────────────────────────────────────────────
  build-rust:
    name: Build Rust binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install the toolchain declared in rust/rust-toolchain.toml (stable,
      # minimal profile). Using @master so it reads the file when located at
      # the workspace root; we supply the channel explicitly here because the
      # toolchain file lives under rust/ rather than the repo root.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # CARGO_INCREMENTAL=0 — incremental artifacts have no value for a
      # release build and only bloat the target directory.
      - name: Build purser-agent and purser-gateway
        working-directory: rust
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: target
        run: cargo build --release -p purser-agent -p purser-gateway

      - uses: actions/upload-artifact@v4
        with:
          name: rust-binaries
          path: |
            rust/target/release/purser-agent
            rust/target/release/purser-gateway

  # ── Job 3: Package (.deb, .rpm, tarballs) ──────────────────────────────────
  package:
    name: Package (deb, rpm, tarballs)
    runs-on: ubuntu-latest
    needs: [build-go, build-rust]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: go-binaries
          path: bin/

      # Place Rust binaries at the path the nfpm config expects:
      #   packaging/nfpm/purser-agent.yaml → src: rust/target/release/purser-agent
      - uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: rust/target/release/

      - name: Fix binary permissions
        run: |
          chmod +x bin/control-plane
          chmod +x rust/target/release/purser-agent
          chmod +x rust/target/release/purser-gateway

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      # Build .deb and .rpm packages.
      # VERSION (no leading 'v') is set in the environment for nfpm config
      # expansion — the config at packaging/nfpm/purser-agent.yaml can
      # reference ${VERSION} once updated to use dynamic versioning.
      - name: Build .deb and .rpm packages
        env:
          VERSION: ${{ env.TAG != '' && env.TAG || inputs.tag }}
        run: |
          # Strip leading 'v' from version tag (e.g. v0.2.0 -> 0.2.0)
          export VERSION=${VERSION#v}
          mkdir -p dist
          nfpm pkg --config packaging/nfpm/purser-agent.yaml --packager deb --target dist/
          nfpm pkg --config packaging/nfpm/purser-agent.yaml --packager rpm --target dist/

      # One tarball per binary, named with the full version tag.
      - name: Create binary tarballs
        run: |
          TAG=${{ env.TAG }}
          mkdir -p dist
          tar -czf dist/purser-agent-linux-amd64-${TAG}.tar.gz \
            -C rust/target/release purser-agent
          tar -czf dist/purser-gateway-linux-amd64-${TAG}.tar.gz \
            -C rust/target/release purser-gateway
          tar -czf dist/control-plane-linux-amd64-${TAG}.tar.gz \
            -C bin control-plane

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/

  # ── Job 4: Docker (GHCR) ───────────────────────────────────────────────────
  docker:
    name: Docker images (GHCR)
    runs-on: ubuntu-latest
    needs: [build-go, build-rust]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Install cosign once; used for keyless signing of all three images below.
      # Signing uses the GitHub Actions OIDC token via id-token:write — no
      # secrets or long-lived keys required.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Each Dockerfile performs its own multi-stage build from source; the
      # pre-built binaries from jobs 1 and 2 act as a quality gate only.

      - name: Build and push control-plane image
        id: push-control-plane
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/control-plane.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/purser-control-plane:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/purser-control-plane:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # Sign by digest (not tag) to pin the exact image layer set.
      # The signature is pushed to the same GHCR namespace alongside the image.
      - name: Sign container image — control-plane
        env:
          DIGEST: ${{ steps.push-control-plane.outputs.digest }}
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/purser-control-plane@${DIGEST}

      - name: Build and push gateway image
        id: push-gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/gateway.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/purser-gateway:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/purser-gateway:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Sign container image — gateway
        env:
          DIGEST: ${{ steps.push-gateway.outputs.digest }}
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/purser-gateway@${DIGEST}

      - name: Build and push ui image
        id: push-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/ui.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/purser-ui:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/purser-ui:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Sign container image — ui
        env:
          DIGEST: ${{ steps.push-ui.outputs.digest }}
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/purser-ui@${DIGEST}

      - name: Record image digests
        run: |
          mkdir -p dist/digests
          echo '${{ steps.push-control-plane.outputs.digest }}' > dist/digests/control-plane
          echo '${{ steps.push-gateway.outputs.digest }}'       > dist/digests/gateway
          echo '${{ steps.push-ui.outputs.digest }}'            > dist/digests/ui

      - uses: actions/upload-artifact@v4
        with:
          name: docker-digests
          path: dist/digests/

  # ── Job 5: GitHub Release + Helm OCI ───────────────────────────────────────
  release:
    name: GitHub Release + Helm OCI push
    runs-on: ubuntu-latest
    needs: [package, docker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: docker-digests
          path: dist/digests/

      # Install cosign for keyless blob signing of the binary tarballs.
      # Uses the GitHub Actions OIDC token — no secrets or long-lived keys.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Generate SPDX SBOMs — runs here (after docker job) so images exist.
      - name: Generate SBOM — control-plane
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/purser-control-plane:${{ env.TAG }}
          artifact-name: sbom-control-plane.spdx.json
          output-file: dist/sbom-control-plane.spdx.json

      - name: Generate SBOM — gateway
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/purser-gateway:${{ env.TAG }}
          artifact-name: sbom-gateway.spdx.json
          output-file: dist/sbom-gateway.spdx.json

      - name: Generate SBOM — ui
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/purser-ui:${{ env.TAG }}
          artifact-name: sbom-ui.spdx.json
          output-file: dist/sbom-ui.spdx.json

      # Sign each binary tarball; the cosign bundle (*.bundle) embeds the
      # certificate and signature and is uploaded as a release asset alongside
      # the tarball so users can verify offline with cosign verify-blob.
      - name: Sign tarballs with cosign
        run: |
          TAG=${{ env.TAG }}
          cosign sign-blob --yes \
            --bundle dist/purser-agent-linux-amd64-${TAG}.tar.gz.bundle \
            dist/purser-agent-linux-amd64-${TAG}.tar.gz
          cosign sign-blob --yes \
            --bundle dist/purser-gateway-linux-amd64-${TAG}.tar.gz.bundle \
            dist/purser-gateway-linux-amd64-${TAG}.tar.gz
          cosign sign-blob --yes \
            --bundle dist/control-plane-linux-amd64-${TAG}.tar.gz.bundle \
            dist/control-plane-linux-amd64-${TAG}.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.tar.gz.bundle
            dist/*.spdx.json
            dist/SHA256SUMS
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ env.TAG }}/CHANGELOG.md) for full release notes.

      # Package and push the Helm chart to the GHCR OCI registry.
      # Chart version is the numeric part of the tag (no leading 'v').
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push Helm chart to GHCR OCI
        run: |
          TAG=${{ env.TAG }}
          VERSION=${TAG#v}
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/purser --version "${VERSION}" --destination dist/
          helm push dist/purser-${VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
