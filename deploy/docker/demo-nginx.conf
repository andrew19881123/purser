# WARNING: This configuration is for LOCAL DEVELOPMENT / DEMO ONLY.
# It runs on plain HTTP (no TLS). Never expose this to the internet.
# For production, use a TLS-terminating ingress with the Helm chart.

server {
    listen 80;
    server_tokens off;

    # Basic security headers even for dev (good habits).
    # NOTE: No HSTS on HTTP-only demo config.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Control Plane API — proxy to internal service
    location /api/ {
        proxy_pass http://control-plane:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Gateway — OpenAI-compatible inference endpoint
    location /v1/ {
        proxy_pass http://gateway:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # UI — everything else
    location / {
        proxy_pass http://ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
