# nginx site config for the Purser SPA.
#
# Serves the static Vite bundle and falls back to index.html for any unknown
# path so client-side routing (react-router) works on deep links and reloads.
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Basic hardening / hygiene.
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # === Security Headers ===

    # HSTS: force HTTPS for 1 year, include sub-domains, enable preload.
    # Enable only when the site is ALWAYS served over HTTPS (nginx behind TLS Ingress).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy for React SPA.
    # 'unsafe-inline' for script/style is required by React; 'unsafe-eval' is omitted
    # (Vite production bundles do not need it). See website/docs/operations/security-headers.md.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy: disable browser features unused by this app.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), hid=()" always;

    # Cross-Origin-Opener-Policy: mitigates Spectre / cross-origin attacks.
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Cross-Origin-Resource-Policy: prevents cross-origin reads of resources.
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # X-XSS-Protection intentionally omitted: deprecated header that can introduce
    # XSS vulnerabilities in old IE versions — replaced by CSP above.

    # Liveness/readiness probe target for Kubernetes.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed, immutable asset bundle -> long cache.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Runtime config, regenerated from env at container start -> never cache, so
    # a restart with new env vars takes effect immediately (unlike the hashed
    # bundle, env.js keeps a stable name).
    location = /env.js {
        try_files $uri =404;
        add_header Cache-Control "no-store";
        default_type application/javascript;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
