# nginx site config for the Purser SPA.
#
# Serves the static Vite bundle and falls back to index.html for any unknown
# path so client-side routing (react-router) works on deep links and reloads.
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Basic hardening / hygiene.
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Liveness/readiness probe target for Kubernetes.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed, immutable asset bundle -> long cache.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Runtime config, regenerated from env at container start -> never cache, so
    # a restart with new env vars takes effect immediately (unlike the hashed
    # bundle, env.js keeps a stable name).
    location = /env.js {
        try_files $uri =404;
        add_header Cache-Control "no-store";
        default_type application/javascript;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
