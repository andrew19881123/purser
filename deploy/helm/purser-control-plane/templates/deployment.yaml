apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "purser-cp.fullname" . }}
  labels:
    {{- include "purser-cp.labels" . | nindent 4 }}
spec:
  # Single writer: the SQLite registry + PKI CA live on one RWO volume.
  # HA (>1 replica) requires the enterprise Registry Raft backend.
  replicas: {{ .Values.replicaCount }}
  strategy:
    # Recreate avoids two pods contending for the ReadWriteOnce data volume
    # during a rollout.
    type: Recreate
  selector:
    matchLabels:
      {{- include "purser-cp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "purser-cp.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: control-plane
          image: {{ include "purser-cp.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
          envFrom:
            - configMapRef:
                name: {{ include "purser-cp.fullname" . }}
          env:
            {{- if eq .Values.database.driver "postgres" }}
            - name: PURSER_DB_URL
              {{- if .Values.database.urlSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.urlSecret | quote }}
                  key: db-url
              {{- else if .Values.database.url }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "purser-cp.secretName" . }}
                  key: db-url
              {{- end }}
            {{- end }}
            {{- if or .Values.license.key .Values.license.existingSecret }}
            - name: PURSER_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.license.existingSecret | default (include "purser-cp.secretName" .) }}
                  key: license-key
            {{- end }}
            {{- with .Values.controlPlane.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
          livenessProbe:
            # DB-independent: the process is up if it accepts TCP on the API port.
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            # Registry-backed health verdict (200 ok, 503 down).
            httpGet:
              path: /api/v1/cluster/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.controlPlane.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "purser-cp.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
