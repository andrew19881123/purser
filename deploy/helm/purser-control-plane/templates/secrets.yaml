{{- /*
Inline Kubernetes Secrets — only rendered when externalSecrets.enabled=false (default).
When ESO is enabled, external-secrets.yaml renders ExternalSecret CRDs instead.
*/ -}}
{{- if not .Values.externalSecrets.enabled }}
{{- $hasDbUrl := and (eq .Values.database.driver "postgres") (not .Values.database.urlSecret) .Values.database.url }}
{{- $hasLicense := and (not .Values.license.existingSecret) .Values.license.key }}
{{- if or $hasDbUrl $hasLicense }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "purser-cp.secretName" . }}
  labels:
    {{- include "purser-cp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $hasDbUrl }}
  db-url: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if $hasLicense }}
  license-key: {{ .Values.license.key | quote }}
  {{- end }}
{{- end }}
{{- end }}
