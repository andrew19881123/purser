{{- /*
Inline Kubernetes Secret for Data Plane credentials.
Only rendered when the user did not supply existing secrets.
*/ -}}
{{- $hasJoinToken := and (not .Values.controlPlane.joinTokenSecret) .Values.controlPlane.joinToken }}
{{- $hasApiKeys := and (not .Values.apiKeysSecret) .Values.apiKeys }}
{{- if or $hasJoinToken $hasApiKeys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "purser-dp.secretName" . }}
  labels:
    {{- include "purser-dp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $hasJoinToken }}
  join-token: {{ .Values.controlPlane.joinToken | quote }}
  {{- end }}
  {{- if $hasApiKeys }}
  api-keys: {{ .Values.apiKeys | quote }}
  {{- end }}
{{- end }}
