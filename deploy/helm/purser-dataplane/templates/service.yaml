apiVersion: v1
kind: Service
metadata:
  name: {{ include "purser-dp.fullname" . }}
  labels:
    {{- include "purser-dp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Default LoadBalancer exposes the OpenAI-compatible inference endpoint externally.
  # Use ClusterIP + Ingress for HTTPS termination.
  type: {{ .Values.service.type }}
  selector:
    {{- include "purser-dp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
