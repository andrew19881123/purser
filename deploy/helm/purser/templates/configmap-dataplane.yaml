{{/*
configmap-dataplane.yaml — Data Plane registration bootstrap ConfigMap.

Rendered only when controlPlane.dataplanes is non-empty.

The Control Plane reads PURSER_SEED_DATAPLANES_CONFIG at startup and creates
each listed DataPlane in the registry (idempotent — existing records are not
overwritten). Each DataPlane's join token is generated by the Control Plane
and stored as a Kubernetes Secret ({{ fullname }}-dp-<id>-token) so remote
Gateways can fetch it at startup.

Use controlPlane.dataplanes[] in values.yaml to pre-register Data Planes;
register manually via the REST API or UI for dynamic environments.
*/}}
{{- if .Values.controlPlane.dataplanes }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "purser.controlPlane.fullname" . }}-dp-seed
  labels:
    {{- include "purser.componentLabels" (dict "ctx" . "component" "control-plane") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
data:
  # JSON array consumed by the Control Plane's SeedDataPlanes initialiser.
  # The schema mirrors the DataPlane REST resource (POST /api/v1/dataplanes).
  dataplanes.json: |
    {{ .Values.controlPlane.dataplanes | toJson }}
{{- end }}
