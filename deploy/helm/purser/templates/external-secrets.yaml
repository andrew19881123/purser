{{- /*
External Secrets Operator (ESO) integration.

When externalSecrets.enabled=true this template renders ExternalSecret CRDs
(external-secrets.io/v1beta1) for each non-empty remoteRef. The inline Secrets
normally rendered by secrets.yaml are suppressed while ESO is enabled.

Requires the External Secrets Operator (https://external-secrets.io) installed
in the cluster, and a ClusterSecretStore or SecretStore named by
externalSecrets.secretStoreRef.name.
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- if .Values.externalSecrets.remoteRefs.internalToken }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "purser.gatewaySecretName" . }}
  labels:
    {{- include "purser.componentLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | quote }}
  target:
    name: {{ include "purser.gatewaySecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: internal-token
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.internalToken | quote }}
{{- end }}
{{- if .Values.externalSecrets.remoteRefs.licenseKey }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "purser.licenseSecretName" . }}
  labels:
    {{- include "purser.componentLabels" (dict "ctx" . "component" "control-plane") | nindent 4 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | quote }}
  target:
    name: {{ include "purser.licenseSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: license-key
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.licenseKey | quote }}
{{- end }}
{{- if .Values.externalSecrets.remoteRefs.joinToken }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-join-token" (include "purser.fullname" .) }}
  labels:
    {{- include "purser.componentLabels" (dict "ctx" . "component" "control-plane") | nindent 4 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | quote }}
  target:
    name: {{ printf "%s-join-token" (include "purser.fullname" .) }}
    creationPolicy: Owner
  data:
    - secretKey: join-token
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.joinToken | quote }}
{{- end }}
{{- end }}
