{{- /*
Inline Kubernetes Secrets — only rendered when externalSecrets.enabled=false
(the default). When ESO is enabled, external-secrets.yaml renders ExternalSecret
CRDs instead and this file is fully suppressed.
*/ -}}
{{- if not .Values.externalSecrets.enabled }}
{{- /*
Gateway shared secret: the internal route-sync token (and optional client API
keys). Consumed by BOTH the Control Plane (PURSER_GATEWAY_TOKEN) and the Gateway
(PURSER_GATEWAY_INTERNAL_TOKEN) so route sync authenticates end to end.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "purser.gatewaySecretName" . }}
  labels:
    {{- include "purser.componentLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
type: Opaque
stringData:
  internal-token: {{ include "purser.gatewayToken" . | quote }}
  {{- if .Values.gateway.apiKeys }}
  api-keys: {{ .Values.gateway.apiKeys | quote }}
  {{- end }}
{{- if .Values.license.key }}
---
{{- /* Enterprise license key (offline-verified). Optional. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "purser.licenseSecretName" . }}
  labels:
    {{- include "purser.componentLabels" (dict "ctx" . "component" "control-plane") | nindent 4 }}
type: Opaque
stringData:
  license-key: {{ .Values.license.key | quote }}
{{- end }}
{{- end }}
