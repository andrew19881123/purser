# Default values for the Purser chart.
# This is a YAML-formatted file. Every knob below is referenced from templates.

# -- Replicas per component. KEEP AT 1.
# The Registry is a single-writer SQLite database and the internal PKI CA lives
# on one PVC; horizontal HA (multi-replica) requires the Registry Raft backend,
# which is an ENTERPRISE feature. Scaling >1 without it corrupts/splits state.
replicaCount: 1

# Override the generated resource name (defaults to the release name).
nameOverride: ""
fullnameOverride: ""

image:
  # Pull policy applied to all component images.
  pullPolicy: IfNotPresent
  controlPlane:
    repository: ghcr.io/andrew19881123/purser-control-plane
    # Defaults to .Chart.AppVersion when left empty.
    tag: "0.2.0"
  gateway:
    repository: ghcr.io/andrew19881123/purser-gateway
    tag: "0.2.0"
  ui:
    repository: ghcr.io/andrew19881123/purser-ui
    tag: "0.2.0"

# Secrets for pulling from a private registry, e.g. [{ name: regcred }].
imagePullSecrets: []

# -- Global default Service type applied to every component unless the component
# overrides it below. Default ClusterIP = in-cluster only.
#
# IMPORTANT (networking): Purser Agents run OUTSIDE Kubernetes (host packages)
# and must reach the Control Plane's RegistrationService (gRPC/mTLS) + REST API.
# For a LAN fleet, set controlPlane.service.type to LoadBalancer or NodePort
# (e.g. --set controlPlane.service.type=LoadBalancer). See deploy/README.md.
service:
  type: ClusterIP

controlPlane:
  httpPort: 8080          # management REST API (/api/v1) and UI backend
  grpcPort: 9443          # RegistrationService gRPC (Agent Join/Heartbeat, mTLS)
  clusterId: "default"    # echoed in join tokens (PURSER_CLUSTER_ID)
  # AgentService port the orchestrator dials back on each node (0 => default 50151).
  agentPort: 0
  service:
    # Empty => inherit the global `service.type`. Override to LoadBalancer /
    # NodePort so out-of-cluster Agents can reach the gRPC RegistrationService +
    # REST API (e.g. --set controlPlane.service.type=LoadBalancer).
    type: ""
    # NodePorts (only applied when type=NodePort; leave empty to auto-assign).
    httpNodePort: ""
    grpcNodePort: ""
    annotations: {}
  persistence:
    # SQLite registry + internal PKI (CA key/cert) are stateful -> persist them.
    enabled: true
    size: 2Gi
    # Empty => cluster default StorageClass.
    storageClass: ""
    accessMode: ReadWriteOnce
    # Mount point inside the container (matches the image's PURSER_DB/PKI_DIR).
    mountPath: /data
    # Reuse a pre-existing PVC instead of creating one (empty => chart creates it).
    existingClaim: ""
  # Extra env passed verbatim to the control-plane container ([{name,value}]).
  extraEnv: []
  resources: {}
    # requests: { cpu: 100m, memory: 128Mi }
    # limits:   { cpu: "1",  memory: 512Mi }

gateway:
  # Port the gateway binds inside the pod and the Service exposes.
  port: 8080
  service:
    # Empty => inherit the global `service.type`.
    type: ""
    nodePort: ""
    annotations: {}
  # Shared internal token for Control-Plane -> Gateway route sync
  # (header X-Purser-Internal-Token). The Control Plane sends it as
  # PURSER_GATEWAY_TOKEN; the Gateway validates it as
  # PURSER_GATEWAY_INTERNAL_TOKEN. Both read it from the SAME generated Secret.
  # Empty => a random token is generated at install and reused on upgrade.
  internalToken: ""
  # Optional comma-separated client API keys (bearer). Empty => OPEN DEV MODE
  # (gateway accepts any non-empty bearer token).
  apiKeys: ""
  extraEnv: []
  resources: {}

ui:
  port: 80
  # Base URL the browser uses for the Control-Plane management REST API
  # (/api/v1). Injected at container start into env.js (window.__PURSER_CONFIG__)
  # as PURSER_API_BASE_URL — Vite bakes build-time env, so this is the knob that
  # works without rebuilding the image.
  # Default: same-origin relative path — route /api/* to the control-plane
  # Service via an ingress. Set an ABSOLUTE URL only when the UI is served from a
  # different origin than the API.
  apiBaseUrl: "/api/v1"
  # OpenAI-compatible Gateway base for the Playground (same-origin by default).
  gatewayBaseUrl: "/v1"
  service:
    # Empty => inherit the global `service.type`.
    type: ""
    nodePort: ""
    annotations: {}
  # Extra env passed verbatim to the ui container ([{name,value}]). Use e.g.
  # PURSER_UI_MOCK=1 to ship the in-memory demo mode (fabricated data — off by
  # default).
  extraEnv: []
  resources: {}

# -- Optional Kubernetes Ingress.
# When enabled, all three components are routed from a SINGLE hostname:
#   /api  (Prefix) → control-plane  (management REST API)
#   /v1   (Prefix) → gateway        (OpenAI-compatible inference)
#   /     (Prefix) → ui             (Operator UI)
# This lets the UI's same-origin defaults (/api/v1 and /v1) work without
# setting absolute URLs. Set ingress.host (required when enabled).
#
# Most LAN users set controlPlane.service.type=LoadBalancer instead; see
# deploy/README.md §3 for a comparison of both networking models.
ingress:
  enabled: false          # opt-in; most LAN users set controlPlane.service.type=LoadBalancer instead
  className: ""           # e.g. "nginx" — empty = use cluster default
  annotations: {}         # e.g. nginx.ingress.kubernetes.io/rewrite-target: /
  host: ""                # required when enabled; e.g. purser.example.com
  tls: []                 # standard Ingress TLS list

# -- TLS / cert-manager integration.
# When tls.certManager.enabled=true the chart renders a cert-manager.io/v1
# Certificate CR for the Control Plane gRPC/mTLS endpoint. The Certificate
# targets the same secret name that the Control Plane mounts for its server
# certificate ({{ fullname }}-control-plane-tls). Requires cert-manager v1.x
# installed in the cluster.
tls:
  certManager:
    enabled: false        # set true to use cert-manager for control-plane TLS
    issuerRef:
      name: ""            # e.g. "letsencrypt-prod" or "internal-ca"
      kind: "ClusterIssuer"
    duration: "8760h"     # 1 year
    renewBefore: "720h"   # 30 days

# Enterprise license (offline-verified against the embedded public key; no
# phone-home). Optional. When set, it is stored in a Secret and exposed to the
# Control Plane as PURSER_LICENSE_KEY. Empty => community edition.
license:
  key: ""

# -- External Secrets Operator (ESO) integration.
# When externalSecrets.enabled=true, ExternalSecret CRDs (apiVersion
# external-secrets.io/v1beta1) are rendered instead of inline Kubernetes
# Secrets. Set secretStoreRef to point at your ClusterSecretStore or
# SecretStore, and fill in the remoteRefs with the vault paths for each secret.
# Only remoteRefs with a non-empty value generate an ExternalSecret.
#
# Requires the External Secrets Operator installed in the cluster:
#   https://external-secrets.io/latest/introduction/getting-started/
externalSecrets:
  enabled: false          # set true to use ESO instead of inline secret values
  secretStoreRef:
    name: ""              # name of the ClusterSecretStore or SecretStore
    kind: "ClusterSecretStore"
  # per-secret remote key paths — fill in for each secret your vault holds
  remoteRefs:
    joinToken: ""         # e.g. "secret/data/purser/join-token"
    internalToken: ""     # e.g. "secret/data/purser/internal-token"
    licenseKey: ""        # e.g. "secret/data/purser/license-key"

# -- Container-level security context applied to every container.
# readOnlyRootFilesystem requires emptyDir mounts for writable paths — the UI
# (nginx) template automatically adds /var/cache/nginx, /var/run, /tmp volumes
# when this is enabled.
containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# -- Pod-level security context. The distroless image runs as UID 65532;
# fsGroup makes the persistent volume group-writable for that user.
podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Optional Kubernetes NetworkPolicy.
# When enabled, ingress/egress rules are rendered for each component.
# Disabled by default; set networkPolicy.enabled=true for production hardening.
networkPolicy:
  enabled: false  # opt-in; set true in production

# Annotations applied to all pods.
podAnnotations: {}

# nodeSelector / tolerations / affinity applied to all workloads.
nodeSelector: {}
tolerations: []
affinity: {}
