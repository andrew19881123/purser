# Purser demo stack — mock engine (DEMO ONLY, no GPU required)
# Usage: docker compose up
# Everything served from ONE port via nginx reverse proxy:
#   http://localhost:3000          → UI Dashboard
#   http://localhost:3000/api/v1   → Control Plane API
#   http://localhost:3000/v1       → Gateway (OpenAI-compatible)
#
# Single-origin design avoids CORS issues in the browser.
#
# Database: PostgreSQL is the default for this stack (PURSER_DB_DRIVER=postgres).
# For SQLite-only local development, set PURSER_DB_DRIVER=sqlite and
# PURSER_DB=/data/registry.db, then remove the postgres depends_on / env vars.
#
# Engine backend: PURSER_ENGINE_BACKEND=mock is set here for the demo stack
# (no GPU needed). Production agents use llamacpp (the Helm chart default).
# Mock returns canned responses only — do NOT use in production.

services:
  # PostgreSQL — production database for the control plane.
  # For local development you can set PURSER_DB_DRIVER=sqlite instead.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: purser
      POSTGRES_PASSWORD: purser
      POSTGRES_DB: purser
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purser"]
      interval: 10s
      timeout: 5s
      retries: 5

  control-plane:
    image: ghcr.io/andrew19881123/purser-control-plane:latest
    environment:
      PURSER_DB_DRIVER: postgres
      PURSER_DB_URL: "postgres://purser:purser@postgres:5432/purser?sslmode=disable"
      PURSER_ADDR: ":8080"
      PURSER_GRPC_ADDR: ":9443"
      PURSER_PKI_DIR: /data/pki
      PURSER_ENGINE_BACKEND: mock
      PURSER_GATEWAY_ADDR: "http://gateway:8081"
      PURSER_GATEWAY_TOKEN: demo-internal-token
    volumes:
      - purser-pki:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

  gateway:
    image: ghcr.io/andrew19881123/purser-gateway:latest
    environment:
      PURSER_GATEWAY_HOST: "0.0.0.0"
      PURSER_GATEWAY_PORT: "8081"
      PURSER_GATEWAY_INTERNAL_TOKEN: demo-internal-token
      PURSER_GATEWAY_API_KEYS: demo-key-12345
      PURSER_CONTROL_PLANE_URL: "http://control-plane:8080"
    depends_on:
      - control-plane

  ui:
    image: ghcr.io/andrew19881123/purser-ui:latest
    environment:
      # Same-origin paths — proxied by the 'proxy' service below
      PURSER_API_BASE_URL: "/api/v1"
      PURSER_GATEWAY_BASE_URL: "/v1"
    depends_on:
      - control-plane

  # nginx reverse proxy — single entry point on port 3000
  # Solves browser CORS: UI, API and Gateway all share the same origin.
  proxy:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./deploy/docker/demo-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ui
      - control-plane
      - gateway

volumes:
  # PKI CA key/cert persist on a dedicated volume (no DB data here when using postgres).
  purser-pki:
  # PostgreSQL data volume.
  postgres_data:
