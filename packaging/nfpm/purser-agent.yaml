# nfpm config for the purser-agent native package (.deb / .rpm).
#
# Build (from the repo root, after `source ./env.sh`):
#   nfpm package -f packaging/nfpm/purser-agent.yaml -p deb -t dist/
#   nfpm package -f packaging/nfpm/purser-agent.yaml -p rpm -t dist/
#
# All `contents.src` / `scripts.*` paths are resolved relative to the current
# working directory (the repo root), matching the commands above.
#
# NOTE on the systemd unit: we ship packaging/nfpm/purser-agent.service (a
# variant with ExecStart=/usr/bin/purser-agent), NOT packaging/systemd/
# purser-agent.service (ExecStart=/usr/local/bin, used by the manual/tarball
# flow). Distro packages must install to /usr/bin, not /usr/local (Debian
# policy 9.1.2), so the shipped unit points there.

name: purser-agent
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: andrew19881123 <andrew19881123@gmail.com>
vendor: Purser
homepage: https://github.com/purser/purser
license: MIT
description: |
  Purser Fleet Agent — node-local daemon for the Purser inference fleet.

  Runs on each physical fleet node: probes the host hardware, supervises the
  local inference engine, and serves the AgentService gRPC API to the Purser
  control plane. Installed as a systemd host service (not a container) because
  it needs direct access to the node's GPUs/accelerators and the engine RPC
  worker it supervises is not sandboxed.

contents:
  # Release binary (stripped) -> /usr/bin (distro-package convention).
  - src: rust/target/release/purser-agent
    dst: /usr/bin/purser-agent
    file_info:
      mode: 0755

  # systemd unit (packaged variant: ExecStart=/usr/bin/purser-agent).
  - src: packaging/nfpm/purser-agent.service
    dst: /lib/systemd/system/purser-agent.service
    file_info:
      mode: 0644

  # Environment template installed as a config file. `config|noreplace` maps to
  # dpkg conffiles / rpm %config(noreplace): an operator-edited agent.env is
  # preserved across upgrades. Shipped root:root 0640 — systemd reads
  # EnvironmentFile= as root before dropping to User=purser, so the service
  # account needs no read access, and this avoids depending on the 'purser'
  # group (created in postinstall) existing at unpack time.
  - src: packaging/env/agent.env.example
    dst: /etc/purser/agent.env
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: root

scripts:
  postinstall: packaging/nfpm/scripts/postinstall.sh
  preremove: packaging/nfpm/scripts/preremove.sh
  postremove: packaging/nfpm/scripts/postremove.sh
