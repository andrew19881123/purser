syntax = "proto3";
package purser.v1;

// go_package matches the convention used by all other .proto files in this
// directory; buf generates into ../go/gen (relative to proto/).
option go_package = "github.com/purser/purser/go/gen/purser/v1;purserv1";

import "google/protobuf/timestamp.proto";

// InferenceEvent records a single inference request for audit purposes.
// Designed for AI Act Art.12 compliance: who requested what, when, using which model.
// Prompt content is NEVER stored (GDPR Article 5 data minimisation).
message InferenceEvent {
  string  request_id        = 1;  // UUID v4, generated by gateway
  string  api_key_hash      = 2;  // SHA-256 of the API key (first 8 hex chars for display)
  string  model_id          = 3;  // e.g. "qwen3-moe-235b"
  string  tenant_id         = 4;  // from API key's team field
  google.protobuf.Timestamp timestamp = 5;
  int64   prompt_tokens     = 6;
  int64   completion_tokens = 7;
  string  endpoint          = 8;  // "openai" | "anthropic" | "embeddings"
  string  client_ip_prefix  = 9;  // CIDR /24 prefix only — no full IP (GDPR minimisation)
  float   latency_ms        = 10; // end-to-end latency
  string  finish_reason     = 11; // "stop" | "length" | "error"

  // AI Act Art.12(1)(a): version tracking — which exact model checkpoint
  // served this request. Empty for pre-feature events (backward compat).
  string model_revision     = 12; // HuggingFace commit hash or checkpoint digest
  string model_quantization = 13; // "q4_k_m", "fp16", "awq", etc.
  string node_id            = 14; // which agent node served the request
  string inference_engine   = 15; // e.g. "llama.cpp/b3497" or "vllm/0.4.2"
}

message ListInferenceEventsRequest {
  string  api_key_hash = 1;  // filter by key (optional)
  string  model_id     = 2;  // filter by model (optional)
  string  tenant_id    = 3;  // filter by tenant (optional)
  int32   limit        = 4;  // default 100, max 1000
  string  page_token   = 5;  // cursor for pagination
  google.protobuf.Timestamp after  = 6;
  google.protobuf.Timestamp before = 7;
}

message ListInferenceEventsResponse {
  repeated InferenceEvent events         = 1;
  string                  next_page_token = 2;
}
