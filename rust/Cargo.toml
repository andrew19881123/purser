[workspace]
resolver = "2"
members = [
    "crates/purser-proto",
    "crates/agent",
    "crates/engine-adapter",
    "crates/adapter-llamacpp",
    "crates/gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Lean build profiles: drop debuginfo (the largest contributor to target size)
# to keep the target directory small on a disk-constrained host.
[profile.dev]
debug = 0

[profile.release]
debug = 0
strip = true
lto = false
