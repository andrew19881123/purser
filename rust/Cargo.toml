[workspace]
resolver = "2"
members = [
    "crates/purser-proto",
    "crates/agent",
    "crates/engine-adapter",
    "crates/adapter-llamacpp",
    "crates/gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aes-gcm = "0.11"
bytes = "1"
foca = { version = "0.13", features = ["std", "postcard-codec"] }
rand = { version = "0.8", features = ["std_rng"] }
serde = { version = "1", features = ["derive"] }
subtle = "2"
zeroize = { version = "1", features = ["derive"] }

# Lean build profiles: drop debuginfo (the largest contributor to target size)
# to keep the target directory small on a disk-constrained host.
[profile.dev]
debug = 0

[profile.release]
debug = 0
strip = true
lto = false
