[package]
name = "purser-adapter-llamacpp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real llama.cpp EngineBackend adapter for Purser (RPC worker/host, GGUF discovery, metrics normalisation)."

[dependencies]
async-trait = "0.1.92"
purser-engine-adapter = { path = "../engine-adapter" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "process",
    "io-util",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"
