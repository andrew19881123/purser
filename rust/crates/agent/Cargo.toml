[package]
name = "purser-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Purser fleet agent: node-local daemon exposing AgentService over gRPC."

[dependencies]
aes-gcm = { workspace = true }
anyhow = "1.0.104"
zeroize = { workspace = true }
base64 = "0.22"
getrandom = "0.2"
async-stream = "0.3.6"
bytes = { workspace = true }
foca = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
async-trait = "0.1.92"
axum = "0.8.9"
fastrand = "2.5.0"
hex = "0.4.3"
mdns-sd = { version = "0.21.1", optional = true }
nvml-wrapper = { version = "0.13.0", optional = true }
prost-types = "0.14.4"
purser-engine-adapter = { version = "0.1.0", path = "../engine-adapter" }
purser-proto = { path = "../purser-proto" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
serde_json = "1"
sha2 = "0.11.0"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "fs", "io-util"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# mDNS/DNS-SD zero-config LAN discovery (`_purser._tcp`). On by default: the
# seed-list discoverer is always available as a fallback, but LAN discovery is
# part of the intended out-of-the-box behaviour.
default = ["mdns"]
# Real accelerator discovery via NVML. OFF by default: it dlopens
# libnvidia-ml at runtime, which is absent on CPU-only build/CI hosts. Enable
# with `--features nvml` on nodes that actually have NVIDIA GPUs.
mdns = ["dep:mdns-sd"]
nvml = ["dep:nvml-wrapper"]
# Pull model weights from HTTP/S mirrors using `reqwest`. Off by default to
# keep the default binary lean (no TLS/HTTP stack). Enable with
# `--features http-fetch` on nodes that fetch weights from an internet origin.
http-fetch = ["dep:reqwest"]
