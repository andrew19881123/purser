site_name: Purser
site_description: Zero-config orchestrator for distributed LLM inference on your own hardware
site_url: https://andrew19881123.github.io/purser/
repo_url: https://github.com/andrew19881123/purser
repo_name: andrew19881123/purser
edit_uri: edit/main/website/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting Started:
    - Quickstart (Helm): getting-started/quickstart.md
    - Architecture: getting-started/architecture.md
    - Deploy Your First Model: getting-started/deploy-model.md
  - Install:
    - Kubernetes (Helm): install/kubernetes.md
    - Linux Agent (.deb/.rpm): install/linux-agent.md
    - macOS / Windows Agent: install/macos-windows.md
    - Enrollment Bundle: install/enrollment-bundle.md
  - Configuration:
    - purser.yaml (Declarative Config): configuration/purser-yaml.md
    - Environment Variables: configuration/env-vars.md
    - Network Proxy & Custom CA: configuration/network-proxy.md
    - OIDC (EntraID / Okta / Keycloak): configuration/oidc.md
    - OpenTelemetry: configuration/otel.md
    - RBAC (API Key Roles): configuration/rbac.md
    - Secret Management (Vault / ESO): configuration/secrets.md
    - Certificate Management (cert-manager): configuration/cert-manager.md
    - Model Sources (S3 / GCS / Azure): configuration/model-sources.md
    - SWIM Gossip Discovery: configuration/swim.md
    - Webhook Notifications: configuration/webhook.md
  - Enterprise:
    - Open-Core Model: enterprise/overview.md
    - Licensing & Key Management: enterprise/licensing.md
    - Tamper-Evident Audit Log: enterprise/audit-log.md
    - Inference Audit Log (AI Act): enterprise/inference-audit.md
    - Deployment Approval Gates: enterprise/deployment-approvals.md
    - Usage Accounting (Chargeback): enterprise/usage-accounting.md
    - Chargeback Reports (Multi-Tenant): enterprise/chargeback.md
    - Policy-as-Code (OPA/Rego): enterprise/policy-as-code.md
    - HA Control Plane (Raft): enterprise/ha-control-plane.md
  - Integrations:
    - Ansible (Fleet Enrollment): integrations/ansible.md
    - LiteLLM: integrations/litellm.md
    - HuggingFace Hub: integrations/huggingface.md
    - AWS SageMaker: integrations/sagemaker.md
    - GCP Vertex AI: integrations/vertexai.md
    - Azure ML: integrations/azureml.md
    - Python SDK: integrations/python-sdk.md
    - TypeScript SDK: integrations/typescript-sdk.md
  - Operations:
    - Backup & Restore: operations/backup-restore.md
    - PKI Operations: operations/pki-operations.md
  - API Reference:
    - Control Plane (/api/v1): api/control-plane.md
    - Gateway (/v1 OpenAI): api/gateway.md
    - Anthropic Compatibility (/v1/messages): api/anthropic-compatibility.md
  - Development:
    - Benchmarking the Planner: development/benchmarking.md
  - Changelog: changelog.md
