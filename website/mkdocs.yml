site_name: Purser
site_description: Zero-config orchestrator for distributed LLM inference on your own hardware
site_url: https://andrew19881123.github.io/purser/
repo_url: https://github.com/andrew19881123/purser
repo_name: andrew19881123/purser
edit_uri: edit/main/website/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting Started:
    - Quickstart (Helm): getting-started/quickstart.md
    - Architecture: getting-started/architecture.md
  - Install:
    - Kubernetes (Helm): install/kubernetes.md
    - Linux Agent (.deb/.rpm): install/linux-agent.md
    - macOS / Windows Agent: install/macos-windows.md
  - Configuration:
    - Environment Variables Reference: configuration/env-vars.md
    - OIDC (EntraID / Okta): configuration/oidc.md
    - OpenTelemetry (Dynatrace / Grafana): configuration/otel.md
    - Secret Management (Vault / ESO): configuration/secrets.md
    - Certificate Management (cert-manager): configuration/cert-manager.md
  - Enterprise:
    - Open-Core Model: enterprise/overview.md
    - Audit Log: enterprise/audit-log.md
  - Integrations:
    - LiteLLM: integrations/litellm.md
  - API Reference:
    - Control Plane (/api/v1): api/control-plane.md
    - Gateway (/v1 OpenAI): api/gateway.md
  - Changelog: changelog.md
